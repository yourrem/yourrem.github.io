<svg xmlns="http://www.w3.org/2000/svg" width="700" height="506" viewBox="0 0 700 506">
  <!-- An original drawing of a broadsword in the spirit of the FF7 title
       screen: floor spotlight, cold blue glow, then the sword itself.
       The sword is drawn along the x axis (pommel at 0, tip at 508) and
       rotated so it leans from top right down to bottom left. -->
  <defs>
    <radialGradient id="floor" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6e5b38" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#3a301d" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#bfe9ff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#4fa6d8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0b2c45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="-46" x2="0" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="0.18" stop-color="#d3e1e9"/>
      <stop offset="0.55" stop-color="#9fb4c0"/>
      <stop offset="0.85" stop-color="#7d919c"/>
      <stop offset="1" stop-color="#5c6d77"/>
    </linearGradient>
    <linearGradient id="sheen" x1="100" y1="0" x2="508" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#e8f8ff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="guard" x1="0" y1="-54" x2="0" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eef2f4"/>
      <stop offset="0.5" stop-color="#b5bec4"/>
      <stop offset="1" stop-color="#6f7a81"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="-8" x2="0" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c0523f"/>
      <stop offset="0.5" stop-color="#8a2a1f"/>
      <stop offset="1" stop-color="#4c140f"/>
    </linearGradient>
    <radialGradient id="pommel" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#b9c3c8"/>
      <stop offset="1" stop-color="#5e686e"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <ellipse cx="290" cy="432" rx="210" ry="48" fill="url(#floor)"/>
  <ellipse cx="300" cy="330" rx="250" ry="120" fill="url(#aura)" transform="rotate(-43 300 330)"/>
  <ellipse cx="250" cy="380" rx="120" ry="60" fill="url(#aura)" transform="rotate(-43 250 380)"/>

  <g transform="translate(575 72) rotate(136.8)">
    <!-- glow hugging the blade -->
    <polygon points="100,-46 478,-46 508,46 100,46" fill="#8fdcff" opacity="0.7" filter="url(#blur)"/>
    <!-- blade -->
    <polygon points="100,-46 478,-46 508,46 100,46" fill="url(#steel)"/>
    <polygon points="100,-46 478,-46 508,46 100,46" fill="url(#sheen)"/>
    <line x1="104" y1="-44" x2="478" y2="-44" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <line x1="120" y1="0" x2="440" y2="0" stroke="#6b7f8a" stroke-width="1.5" opacity="0.35"/>
    <polygon points="100,-46 478,-46 508,46 100,46" fill="none" stroke="#2e3a41" stroke-width="2"/>
    <!-- the two holes near the guard -->
    <circle cx="128" cy="-13" r="5.5" fill="#1b2328"/>
    <circle cx="128" cy="13" r="5.5" fill="#1b2328"/>
    <!-- guard -->
    <rect x="80" y="-54" width="22" height="108" rx="3" fill="url(#guard)" stroke="#2e3a41" stroke-width="2"/>
    <!-- grip, wrapped -->
    <rect x="10" y="-8" width="72" height="16" fill="url(#grip)" stroke="#2a0d09" stroke-width="1.5"/>
    <g stroke="#3a0f0a" stroke-width="2" opacity="0.7">
      <line x1="20" y1="-8" x2="26" y2="8"/><line x1="32" y1="-8" x2="38" y2="8"/>
      <line x1="44" y1="-8" x2="50" y2="8"/><line x1="56" y1="-8" x2="62" y2="8"/>
      <line x1="68" y1="-8" x2="74" y2="8"/>
    </g>
    <!-- pommel -->
    <circle cx="2" cy="0" r="11" fill="url(#pommel)" stroke="#2e3a41" stroke-width="1.5"/>
    <circle cx="2" cy="0" r="16" fill="#cfefff" opacity="0.25" filter="url(#soft)"/>
  </g>
</svg>
